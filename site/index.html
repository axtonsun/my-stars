<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>目录柜 · GitHub Stars</title>
<meta name="description" content="把 GitHub Star 收进一个目录柜：一个抽屉一个分类，一个仓库一张卡片">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='28' height='24' rx='2' fill='%23d3a875' stroke='%232a2522' stroke-width='1.6'/%3E%3Crect x='8' y='8' width='16' height='8' fill='%23fbf6ea' stroke='%232a2522' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='22' r='2.6' fill='%23cfa64e' stroke='%232a2522' stroke-width='1.2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/noto-serif-sc/noto-serif-sc-400.css">
<link rel="stylesheet" href="fonts/noto-serif-sc/noto-serif-sc-700.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="loading">
<button type="button" class="skip" id="skip">跳到卡片列表</button>
<header class="top">
  <div class="lang" role="group" aria-label="语言 / Language"><button type="button" data-lang="zh" lang="zh-CN" aria-pressed="true">中文</button><button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button></div>
  <div class="ttl">
    <div class="ttl-row"><h1>目录柜</h1><p id="alt" class="alt">a card catalogue of GitHub stars</p></div>
    <p id="sub" class="sub">一个抽屉一个分类，抽屉里一个仓库一张卡片</p>
  </div>
  <label class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15 15l5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="检索  仓库名、简介、标签……" autocomplete="off" spellcheck="false" aria-label="检索">
    <kbd>/</kbd>
  </label>
</header>
<main class="layout">
  <div class="cab-col"><svg id="floor" aria-hidden="true"></svg><svg id="cabinet" role="group" aria-label="目录柜：每个抽屉是一个分类"></svg></div>
  <section id="panel" class="panel"></section>
  <p id="status" class="sr-only" role="status"></p>
  <div id="loading" class="loading" role="status"><div class="ld-msg"><p>正在打开柜子……</p></div></div>
</main>
<footer id="foot" class="foot"></footer>
<script src="i18n.js"></script>
<script src="draw.js"></script>
<script src="app.js"></script>
</body>
</html>
