name: Sync stars & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 20 * * *" # 每天北京时间 04:17
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch starred repos
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STARS_USER: ${{ github.repository_owner }}
        run: python3 scripts/sync_stars.py

      # Only commit when stars were added/removed, so the history stays quiet.
      - name: Commit star list changes
        if: steps.sync.outputs.list_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stars.json
          git commit -m "chore: sync starred repos"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp data/*.json _site/data/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
